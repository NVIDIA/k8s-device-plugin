{{- if or .Values.gfd.enabled (eq (include "nvidia-device-plugin.hasConfigMap" .) "true") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nvidia-device-plugin.fullname" . }}-role-binding
  labels:
    {{- include "nvidia-device-plugin.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nvidia-device-plugin.fullname" . }}-service-account
    namespace: {{ include "nvidia-device-plugin.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "nvidia-device-plugin.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if eq (include "nvidia-device-plugin.isOpenShift" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nvidia-device-plugin.fullname" . }}-scc-role-binding
  namespace: {{ include "nvidia-device-plugin.namespace" . }}
  labels:
    {{- include "nvidia-device-plugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nvidia-device-plugin.fullname" . }}-scc-role
subjects:
  - kind: ServiceAccount
    name: {{ include "nvidia-device-plugin.fullname" . }}-service-account
    namespace: {{ include "nvidia-device-plugin.namespace" . }}
  {{- if and .Values.gfd.enabled (eq (include "nvidia-device-plugin.nfdEnabled" .) "true") }}
  - kind: ServiceAccount
    name: {{ include "nvidia-device-plugin.fullname" . }}-node-feature-discovery-worker
    namespace: {{ include "nvidia-device-plugin.namespace" . }}
  {{- end }}
{{- end }}
