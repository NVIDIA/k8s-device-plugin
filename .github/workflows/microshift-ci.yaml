name: MicroShift CI

on:
  push:
    branches:
      - "feature/*"

jobs:
  helm-tests:
    name: Helm Template Tests
    runs-on: [self-hosted, microshift]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run helm template tests
        run: make test-helm

  microshift-base:
    name: Base Install (no GFD)
    runs-on: [self-hosted, microshift]
    needs: helm-tests
    env:
      NAMESPACE: nvidia-device-plugin
      HELM_CHART: ./deployments/helm/nvidia-device-plugin
      RELEASE: nvidia-device-plugin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check MicroShift is ready
        run: |
          kubectl get nodes
          kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded | grep -v NAMESPACE || true

      - name: Uninstall previous releases
        run: |
          for release in $(helm list -n "$NAMESPACE" -q 2>/dev/null); do
            echo "Removing release: $release"
            helm uninstall "$release" -n "$NAMESPACE" --wait || true
          done

      - name: Create namespace with PSS labels
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | \
            kubectl apply -f -
          kubectl label namespace "$NAMESPACE" \
            pod-security.kubernetes.io/enforce=privileged \
            --overwrite

      - name: Install chart (base, no GFD)
        run: |
          helm install "$RELEASE" "$HELM_CHART" \
            --namespace "$NAMESPACE" \
            --set compatWithCPUManager=true \
            --wait \
            --timeout 120s

      - name: Verify no ClusterRole without GFD
        run: |
          echo "--- ClusterRole (should NOT exist) ---"
          if kubectl get clusterrole -l app.kubernetes.io/instance="$RELEASE" 2>/dev/null | grep -q nvidia; then
            echo "FAIL: ClusterRole should not exist without gfd.enabled"
            kubectl get clusterrole -l app.kubernetes.io/instance="$RELEASE" -o yaml
            exit 1
          fi
          echo "OK: no ClusterRole created"

          echo "--- ClusterRoleBinding (should NOT exist) ---"
          if kubectl get clusterrolebinding -l app.kubernetes.io/instance="$RELEASE" 2>/dev/null | grep -q nvidia; then
            echo "FAIL: ClusterRoleBinding should not exist without gfd.enabled"
            exit 1
          fi
          echo "OK: no ClusterRoleBinding created"

      - name: Verify namespaced Role has SCC rule
        run: |
          echo "--- Namespaced Role ---"
          kubectl get role -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" -o yaml | \
            grep -q 'security.openshift.io' && echo "OK: SCC rule in namespaced Role" || \
            { echo "FAIL: SCC rule missing from namespaced Role"; exit 1; }

          echo "--- RoleBinding ---"
          kubectl get rolebinding -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" -o yaml | \
            grep -q 'kind: Role' && echo "OK: RoleBinding references Role" || \
            { echo "FAIL: RoleBinding missing or wrong"; exit 1; }

      - name: Wait for DaemonSet rollout
        run: |
          kubectl rollout status daemonset -n "$NAMESPACE" \
            -l app.kubernetes.io/instance="$RELEASE" \
            --timeout=120s

      - name: Verify pods running with correct SCC
        run: |
          echo "--- Device plugin pod SCC ---"
          SCC=$(kubectl get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/instance="$RELEASE" \
            -l app.kubernetes.io/name=nvidia-device-plugin \
            -o jsonpath='{.items[0].metadata.annotations.openshift\.io/scc}')
          echo "Device plugin pod SCC: $SCC"
          if [ "$SCC" != "privileged" ]; then
            echo "FAIL: expected SCC 'privileged', got '$SCC'"
            exit 1
          fi
          echo "OK: device plugin pod running with privileged SCC"

      - name: Verify GPU resources advertised
        run: |
          echo "--- Waiting for GPU capacity on node ---"
          for i in $(seq 1 30); do
            GPU_COUNT=$(kubectl get nodes -o jsonpath='{.items[0].status.capacity.nvidia\.com/gpu}' 2>/dev/null || echo "0")
            if [ -n "$GPU_COUNT" ] && [ "$GPU_COUNT" != "0" ]; then
              break
            fi
            echo "Attempt $i/30: nvidia.com/gpu not yet reported, waiting 2s..."
            sleep 2
          done

          echo "--- Node GPU capacity ---"
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}nvidia.com/gpu={.status.capacity.nvidia\.com/gpu}{"\n"}{end}'

          if [ "$GPU_COUNT" = "0" ] || [ -z "$GPU_COUNT" ]; then
            echo "WARNING: no nvidia.com/gpu capacity reported after 60s (GPU may not be present)"
          else
            echo "OK: $GPU_COUNT GPU(s) advertised"
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== DaemonSet ==="
          kubectl describe daemonset -n "$NAMESPACE" || true
          echo "=== Pods ==="
          kubectl describe pods -n "$NAMESPACE" || true
          echo "=== Pod Logs ==="
          kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" --tail=100 || true
          echo "=== Events ==="
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' || true

  microshift-gfd:
    name: Install with GFD
    runs-on: [self-hosted, microshift]
    needs: microshift-base
    env:
      NAMESPACE: nvidia-device-plugin
      HELM_CHART: ./deployments/helm/nvidia-device-plugin
      RELEASE: nvidia-device-plugin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Upgrade to enable GFD
        run: |
          helm upgrade "$RELEASE" "$HELM_CHART" \
            --namespace "$NAMESPACE" \
            --set compatWithCPUManager=true \
            --set gfd.enabled=true \
            --wait \
            --timeout 300s

      - name: Verify ClusterRole exists with GFD
        run: |
          echo "--- ClusterRole (should exist with node/NFD rules) ---"
          kubectl get clusterrole -l app.kubernetes.io/instance="$RELEASE" -o yaml | \
            grep -q 'nodes' && echo "OK: ClusterRole has node rules" || \
            { echo "FAIL: ClusterRole missing or no node rules"; exit 1; }

          kubectl get clusterrole -l app.kubernetes.io/instance="$RELEASE" -o yaml | \
            grep -q 'nfd.k8s-sigs.io' && echo "OK: ClusterRole has NFD rules" || \
            { echo "FAIL: ClusterRole missing NFD rules"; exit 1; }

          echo "--- ClusterRole must NOT have SCC rule ---"
          if kubectl get clusterrole -l app.kubernetes.io/instance="$RELEASE" -o yaml | grep -q 'security.openshift.io'; then
            echo "FAIL: SCC rule should not be in ClusterRole"
            exit 1
          fi
          echo "OK: SCC rule not in ClusterRole"

          echo "--- ClusterRoleBinding ---"
          kubectl get clusterrolebinding -l app.kubernetes.io/instance="$RELEASE" -o yaml | \
            grep -q 'kind: ClusterRole' && echo "OK: ClusterRoleBinding exists" || \
            { echo "FAIL: ClusterRoleBinding missing"; exit 1; }

      - name: Verify namespaced Role still has SCC rule
        run: |
          kubectl get role -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" -o yaml | \
            grep -q 'security.openshift.io' && echo "OK: SCC rule still in namespaced Role" || \
            { echo "FAIL: SCC rule missing from namespaced Role"; exit 1; }

      - name: Wait for DaemonSet rollout
        run: |
          kubectl rollout status daemonset -n "$NAMESPACE" \
            -l app.kubernetes.io/instance="$RELEASE" \
            --timeout=120s

      - name: Verify pods running with correct SCC
        run: |
          SCC=$(kubectl get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/instance="$RELEASE" \
            -l app.kubernetes.io/name=nvidia-device-plugin \
            -o jsonpath='{.items[0].metadata.annotations.openshift\.io/scc}')
          echo "Device plugin pod SCC: $SCC"
          if [ "$SCC" != "privileged" ]; then
            echo "FAIL: expected SCC 'privileged', got '$SCC'"
            exit 1
          fi
          echo "OK: device plugin pod running with privileged SCC"

      - name: Verify GPU resources advertised
        run: |
          for i in $(seq 1 30); do
            GPU_COUNT=$(kubectl get nodes -o jsonpath='{.items[0].status.capacity.nvidia\.com/gpu}' 2>/dev/null || echo "0")
            if [ -n "$GPU_COUNT" ] && [ "$GPU_COUNT" != "0" ]; then
              break
            fi
            echo "Attempt $i/30: waiting 2s..."
            sleep 2
          done

          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}nvidia.com/gpu={.status.capacity.nvidia\.com/gpu}{"\n"}{end}'

          if [ "$GPU_COUNT" = "0" ] || [ -z "$GPU_COUNT" ]; then
            echo "WARNING: no nvidia.com/gpu capacity reported after 60s"
          else
            echo "OK: $GPU_COUNT GPU(s) advertised"
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== DaemonSet ==="
          kubectl describe daemonset -n "$NAMESPACE" || true
          echo "=== Pods ==="
          kubectl describe pods -n "$NAMESPACE" || true
          echo "=== Pod Logs ==="
          kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/instance="$RELEASE" --tail=100 || true
          echo "=== Events ==="
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' || true
