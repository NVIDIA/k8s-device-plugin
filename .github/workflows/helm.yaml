name: Helm

on:
  workflow_call:
    inputs:
      golang_version:
        required: true
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version: ${{ inputs.golang_version }}
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: 3.14.4
    - name: Check values.schema.json is up to date
      run: make check-helm-values-schema
    - name: Lint chart
      run: make lint-helm
    - run: make test-helm
