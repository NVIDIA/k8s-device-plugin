name: Third-Party Notices

on:
  workflow_call:
    inputs:
      golang_version:
        required: true
        type: string

jobs:
  check-third-party-notices:
    name: Check THIRD_PARTY_NOTICES.md is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.golang_version }}

      - name: Verify THIRD_PARTY_NOTICES.md is up to date
        run: make check-third-party-notices
